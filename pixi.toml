[workspace]
name = "epiforecasts-nhs-pressure"
version = "0.1.0"
description = "Probabilistic NHS Winter / System Pressure Early Warning"
channels = ["conda-forge"]
# Local reliability-first default for this workspace.
platforms = ["win-64"]

[dependencies]
python = ">=3.10,<3.13"
# Lets PyTensor compile C ops (much faster than pure Python). See docs/PYTENSOR_COMPILER.md
cxx-compiler = "*"
xarray = ">=2026.4.0,<2027"
gxx = ">=15.2.0,<15.3"
scikit-learn = ">=1.8.0,<2"
h5netcdf = ">=1.8.1,<2"

[pypi-dependencies]
numpy = "*"
pandas = "*"
scipy = "*"
pymc = "*"
arviz = "*"
matplotlib = "*"
streamlit = "*"

[tasks]
install = "uv pip install -e ."
generate-data = "epiforcasts-generate"
run-inference = "epiforcasts-inference --fast"
run-inference-full = "epiforcasts-inference --full"
daemon = "epiforcasts-daemon"
daemon-once = "epiforcasts-daemon --once"
cache-warm = "epiforcasts-cache warm"
cache-check = "epiforcasts-cache check"
cache-status = "epiforcasts-cache status"
cache-clear = "epiforcasts-cache clear"
health-check = "epiforcasts-health"
acceptance-check = "epiforcasts-acceptance"
run-dashboard = "epiforcasts-launch --preferred-port 8501 --max-port 8510"
run-dashboard-fast = "epiforcasts-launch --app src/epiforcasts_nhs/dashboard/app_fast.py --preferred-port 8501 --max-port 8510"
run-dashboard-resilient = "epiforcasts-resilient --app full --preferred-port 8501 --max-port 8510 --fallback-on-any-failure"
run-dashboard-fast-resilient = "epiforcasts-resilient --app fast --preferred-port 8501 --max-port 8510 --fallback-on-any-failure"
evidence-cycle = "epiforcasts-evidence --run-inference-fast"
run-full-pipeline = { cmd = "epiforcasts-create-initial-data && epiforcasts-daemon --interval-hours=0.01" }
dev = { cmd = "epiforcasts-generate && epiforcasts-daemon --once && epiforcasts-launch --app src/epiforcasts_nhs/dashboard/app_fast.py --preferred-port 8501 --max-port 8510", description = "Development setup: data + single inference + fast UI" }
