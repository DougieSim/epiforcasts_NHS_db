name: Smoke Check

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install C++ toolchain (PyTensor acceleration)
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Sync environment
        run: uv sync

      - name: CLI wiring smoke
        run: uv run epiforcasts --help

      - name: Health check
        run: uv run epiforcasts health

      - name: Fast deterministic inference smoke
        run: uv run epiforcasts inference --fast --advi-steps 500 --seed 42 --output-path ci_posteriors.nc

      - name: Acceptance checks
        run: uv run epiforcasts acceptance --posterior ci_posteriors.nc --metadata ci_posteriors_metadata.nc
